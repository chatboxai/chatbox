productName: Chatbox
appId: xyz.chatboxapp.app
# Match packages/chatbox-i18n/src/languages.ts using Windows/Linux locale filenames.
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
  - ja
  - ko
  - ru
  - de
  - fr
  - pt-PT
  - es
  - ar
  - it
  - sv
  - nb
  - tr
asar: true
asarUnpack:
  - "**/*.{node,dll}"
  - "**/node_modules/libsql/**"
files:
  - "dist"
  # - "!dist/**/*.map"
  # - "!dist/**/stats.html"
  - "node_modules"
  - "!node_modules/@types"
  - "!node_modules/undici-types"
  - "package.json"

beforePack: .erb/scripts/ensure-app-deps.cjs
afterPack: .erb/scripts/after-pack.cjs
afterSign: .erb/scripts/notarize.js

# releaseInfo:
#   releaseNotes: See the changelog for details

mac:
  # macOS uses .lproj names; electron-builder matches them exactly.
  electronLanguages:
    - en
    - zh_CN
    - zh_TW
    - ja
    - ko
    - ru
    - de
    - fr
    - pt_PT
    - es
    - ar
    - it
    - sv
    - nb
    - tr
  notarize: false
  category: public.app-category.developer-tools
  target:
    target: default
    arch:
      - arm64
      - x64
  type: distribution
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  verifyUpdateCodeSignature: false
  artifactName: ${productName}-${version}-Setup.${ext}
  signtoolOptions:
    sign: ./custom_win_sign.js
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: assets/installer.nsh

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  app: release/app
  buildResources: assets
  output: release/build

extraResources:
  - ./assets/**

publish:
  - provider: s3
    bucket: chatbox
    endpoint: https://208624959c9d215edea0720162a740c1.r2.cloudflarestorage.com
    path: /releases
    channel: ${env.UPDATE_CHANNEL}
