<!DOCTYPE html>
<html lang="en" data-theme="light" data-mantine-color-scheme="light" data-chatbox-demo="1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Chatbox</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #ffffff;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      html[data-chatbox-demo] * {
        pointer-events: none !important;
        caret-color: transparent !important;
      }
      html[data-chatbox-demo] .image-creator-reference-label {
        display: none;
      }
      html[data-demo-scene='image-generation'] .shrink-0.overflow-hidden.transition-all {
        width: 0 !important;
        min-width: 0 !important;
        border-left-width: 0 !important;
      }
      html[data-demo-scene='image-generation'] .mantine-ScrollArea-root .mantine-Image-root,
      html[data-demo-scene='image-generation'] .mantine-ScrollArea-root .mantine-Image-root img,
      html[data-demo-scene='image-generation'] .mantine-ScrollArea-root .mantine-Skeleton-root {
        width: 240px !important;
        height: 240px !important;
        max-width: 240px !important;
        max-height: 240px !important;
      }
      html[data-demo-scene='image-generation'] .mantine-ScrollArea-root {
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function isolateDemoStorage() {
        var mem = Object.create(null)
        var memoryStorage = {
          getItem: function (key) {
            return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null
          },
          setItem: function (key, value) {
            mem[key] = String(value)
          },
          removeItem: function (key) {
            delete mem[key]
          },
          clear: function () {
            mem = Object.create(null)
          },
          key: function (index) {
            return Object.keys(mem)[index] || null
          },
          get length() {
            return Object.keys(mem).length
          },
        }
        try {
          Object.defineProperty(window, 'localStorage', { value: memoryStorage })
          Object.defineProperty(window, 'sessionStorage', { value: memoryStorage })
        } catch (error) {}
        try {
          Object.defineProperty(window, 'indexedDB', { value: undefined })
        } catch (error) {}
      })()
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
